<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Social share image placeholder">
  <!-- Boilerplate social-share (Open Graph) image, 1200x630.
       Note: many platforms prefer PNG/JPG for OG images. For best results,
       export this to og-image.png and point IMG_OG at it. -->
  <defs>
    <linearGradient id="ogGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b1a"/>
      <stop offset="1" stop-color="#3a2f29"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogGradient)"/>
  <circle cx="1050" cy="120" r="220" fill="#b5532a" opacity="0.18"/>
  <circle cx="120" cy="560" r="180" fill="#e0784a" opacity="0.12"/>
  <text x="90" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="92"
        font-weight="600" fill="#ffffff">Fabiano Weimar</text>
  <text x="92" y="392" font-family="Helvetica, Arial, sans-serif" font-size="36"
        fill="#cdbfb6">Notes on software engineering and assorted topics.</text>
</svg>
